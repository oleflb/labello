[workspace]
members = [
    "crates/labello-api",
    "crates/labello-client",
    "crates/labello-domain",
    "crates/labello-storage",
    "crates/labello-ui",
    "apps/labello-server",
    "apps/labello-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/labello"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde", "clock", "wasmbind"] }
console_error_panic_hook = "0.1"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
egui_kittest = "0.35"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
infer = "0.16"
js-sys = "0.3"
jsonschema = "0.30"
mime_guess = "2"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_urlencoded = "0.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-wasm = "0.2"
unicode-normalization = "0.1"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["js", "serde", "v4", "v7"] }
walkdir = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
web-time = "1"
