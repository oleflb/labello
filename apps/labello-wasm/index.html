<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Labello</title>
    <style>
      html, body, canvas { width: 100%; height: 100%; margin: 0; background: #0f172a; }
      body { overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; }
      #startup-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        color: #cbd5e1;
        background: #0f172a;
        text-align: center;
        z-index: 10;
      }
      #startup-status[data-error="true"] { color: #fecaca; }
    </style>
    <script>
      function showStartupFailure(reason) {
        const status = document.getElementById("startup-status");
        if (!status) return;
        status.dataset.error = "true";
        status.textContent = `Labello could not start. Rebuild and redeploy the complete WASM distribution. Details: ${reason}`;
      }
      window.addEventListener("error", event => {
        showStartupFailure(event.message || "application asset failed to load");
      });
      window.addEventListener("unhandledrejection", event => {
        showStartupFailure(event.reason?.message || event.reason || "application startup was rejected");
      });
    </script>
  </head>
  <body>
    <div id="startup-status" role="status">Loading Labello...</div>
    <canvas id="labello-canvas"></canvas>
  </body>
</html>
