[package]
name = "labello-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook.workspace = true
eframe.workspace = true
labello-config = { path = "../../crates/labello-config" }
labello-domain = { path = "../../crates/labello-domain" }
labello-ui = { path = "../../crates/labello-ui" }
serde_json.workspace = true
tracing.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["console", "Document", "Element", "Headers", "HtmlCanvasElement", "Location", "Request", "RequestCache", "RequestCredentials", "RequestInit", "Response", "Url", "UrlSearchParams", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
tracing-wasm.workspace = true
