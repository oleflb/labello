[package]
name = "labello-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
labello-client = { path = "../labello-client" }
labello-domain = { path = "../labello-domain" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
url.workspace = true
web-time.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Blob", "DomException", "DomStringList", "Document", "Element", "Event", "EventTarget", "File", "FileList", "FormData", "Headers", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "Request", "RequestCredentials", "RequestInit", "Response", "Storage", "Url", "Window"] }
